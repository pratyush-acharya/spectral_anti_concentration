[project]
name = "spectral-anti-concentration"
version = "0.1.0"
description = "Spectral anti-concentration and the dual geometry of transformer representations"
readme = "README.md"
license = {text = "CC-BY-4.0"}
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.12.0",
    "bcrypt>=5.0.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.0",
    "python-dotenv>=1.2.1",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "torch>=2.9.1",
    "tqdm>=4.67.1",
    "transformers>=4.57.3",
    "safetensors>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spectral_anti_concentration"]
